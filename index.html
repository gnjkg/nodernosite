<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/favicon.jpg"
    />

    <!-- Preload Hero Image -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/hero-image.jpg"
      fetchpriority="high"
    />

    <!-- Primary SEO -->
    <title>Noderno | Websites, Software and IoT Solutions</title>

    <meta
      name="description"
      content="Noderno builds modern websites, custom software, automation systems, and IoT solutions that help businesses improve operations and grow."
    />

    <meta
      name="keywords"
      content="Noderno, web development Philippines, software development Philippines, IoT solutions, business automation, custom software, website development"
    />

    <meta name="author" content="Noderno" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1C324C" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://noderno.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noderno" />
    <meta property="og:url" content="https://noderno.dev/" />

    <meta
      property="og:title"
      content="Noderno | Websites, Software and IoT Solutions"
    />

    <meta
      property="og:description"
      content="Noderno builds modern websites, custom software, automation systems, and IoT solutions that help businesses improve operations and grow."
    />

    <meta
      property="og:image"
      content="https://noderno.dev/images/noderno-social-preview.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://noderno.dev/images/noderno-social-preview.jpg"
    />

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Noderno websites, software, automation, and IoT solutions"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Noderno | Websites, Software and IoT Solutions"
    />

    <meta
      name="twitter:description"
      content="Noderno builds modern websites, custom software, automation systems, and IoT solutions that help businesses improve operations and grow."
    />

    <meta
      name="twitter:image"
      content="https://noderno.dev/images/noderno-social-preview.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Noderno websites, software, automation, and IoT solutions"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Noderno",
        "url": "https://noderno.dev/",
        "logo": "https://noderno.dev/images/noderno-logo.png",
        "email": "support@noderno.dev",
        "description": "Noderno builds modern websites, custom software, automation systems, and IoT solutions that help businesses improve operations and grow.",
        "areaServed": {
          "@type": "Country",
          "name": "Philippines"
        },
        "knowsAbout": [
          "Website Development",
          "Custom Software Development",
          "Business Automation",
          "Internet of Things",
          "UI and UX Design"
        ]
      }
    </script>
  </head>

  <body class="bg-slate-950 text-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
